# Shared mise template for Kotlin/Gradle libraries.
#
# Copy this to `mise.toml` at the root of a library repo. The CI in
# `amine2233/kotlin-ci-shared` does not re-implement build/test/docs/release
# steps — it installs mise (which provisions the [tools] below) and runs these
# tasks via `mise run <task>`. Keep task NAMES stable so the shared workflows
# keep working; change task BODIES per project as needed.

[tools]
java = "temurin-21"
node = "22"
ktlint = "1.8.0"

[env]
_.file = { path = ".env.local", redact = true }

[tasks.build]
description = "Compile everything and run all checks."
run = "./gradlew build --no-daemon"

[tasks.test]
description = "Run the unit tests."
run = "./gradlew jvmTest test --no-daemon"

[tasks.test-coverage]
description = "Run the unit tests, write the merged Kover HTML report to build/reports/kover/html and verify the minimum line coverage."
run = "./gradlew jvmTest test koverHtmlReport koverVerify --no-daemon"

[tasks.format]
description = "Format Kotlin sources with ktlint."
run = "ktlint --format '**/*.kt' '**/*.kts' '!**/build/**'"

[tasks.check_code]
description = "Lint Kotlin sources with ktlint."
run = "ktlint '**/*.kt' '**/*.kts' '!**/build/**' --reporter=plain"

# Convenience aggregate used by CI's lint job: `mise run lint`.
[tasks.lint]
description = "Run all static checks."
depends = ["check_code"]

# Used by CI's title-check job; PR_TITLE comes from the workflow.
[tasks.check_merge_request_title]
description = "Check the pull request title follows Conventional Commits."
run = 'echo "${PR_TITLE?}" | npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --extends @commitlint/config-conventional'

[tasks.build_documentations]
description = "Build the aggregated API documentation with Dokka into build/dokka/html."
run = "./gradlew dokkaGenerateHtml --no-daemon"

# Called by semantic-release (@semantic-release/exec publishCmd in .releaserc.json).
[tasks.publish]
description = "Publish the library to GitHub Packages. Needs GITHUB_ACTOR / GITHUB_TOKEN."
usage = '''
flag "--version <version>" help="Version to publish (e.g. 1.2.3)" required=#true
'''
run = './gradlew publish -Pversion="${usage_version?}" --no-daemon'

[tasks.verify-publish]
description = "Publish both modules to build/local-maven-repo with a test version, check the artifacts and metadata, and compile the kmp-consumer fixture."
run = '''
#!/usr/bin/env bash
set -euo pipefail

version="0.0.0-verify"
rm -rf build/local-maven-repo
./gradlew publishAllPublicationsToLocalVerifyRepository verifyLocalPublication -Pversion="$version" --no-daemon
./gradlew -p kmp-consumer compileKotlinJvm compileKotlinIosSimulatorArm64 -PnetworkingMiddleVersion="$version" --no-daemon
'''

[tasks.verify-xcframework]
description = "Build the release NetworkingMiddleKotlin XCFramework, check its ios-arm64, ios-arm64-simulator and macos-arm64 slices, and run the swift-consumer Swift tests against it."
run = '''
#!/usr/bin/env bash
set -euo pipefail

xcframework="networking-middle-apple/build/XCFrameworks/release/NetworkingMiddleKotlin.xcframework"
./gradlew :networking-middle-apple:assembleNetworkingMiddleKotlinReleaseXCFramework --no-daemon

echo "Slices in $xcframework:"
ls -1 "$xcframework" | grep -v '^Info.plist$'
for slice in ios-arm64 ios-arm64-simulator macos-arm64; do
    if [[ ! -d "$xcframework/$slice" ]]; then
        echo "error: $xcframework is missing the $slice slice" >&2
        exit 1
    fi
done

rm -rf swift-consumer/build/NetworkingMiddleKotlin.xcframework
mkdir -p swift-consumer/build
cp -R "$xcframework" swift-consumer/build/
swift test --package-path swift-consumer
'''

[tasks.release]
description = "Run semantic-release. Use --dry-run to preview without publishing. The conventionalcommits preset is pinned to 8: @semantic-release/commit-analyzer 13 bundles 8.0.0 and the 10.x preset breaks conventional-changelog-writer 8."
usage = '''
flag "-d --dry-run" help="Preview the release without publishing (no tag, no commit, no GitHub Release)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

dry_run_opt=""
if [[ "${usage_dry_run:-}" == "true" ]]; then
    dry_run_opt="--dry-run"
fi

npx --yes \
    -p semantic-release \
    -p @semantic-release/changelog \
    -p @semantic-release/exec \
    -p @semantic-release/git \
    -p conventional-changelog-conventionalcommits@8 \
    semantic-release $dry_run_opt
'''

[tasks.sample]
description = "Run the Ktor sample against httpbin.org."
run = "./gradlew :sample:run --no-daemon"
