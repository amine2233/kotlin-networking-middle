# Copy into the consumer repo at: .github/workflows/ci.yml
# Requires a mise.toml with `test` and `lint` tasks (see templates/mise.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: amine2233/kotlin-ci-shared/.github/workflows/ci.yml@1.0.0
    with:
      enable-lint: true
      enable-coverage: true
      enable-title-check: true

  apple-tests:
    name: Apple tests (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - run: ./gradlew :networking-middle:allTests :networking-middle-ktor:allTests --no-daemon
