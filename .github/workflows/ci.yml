# Copy into the consumer repo at: .github/workflows/ci.yml
# Requires a mise.toml with `test` and `lint` tasks (see templates/mise.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: amine2233/kotlin-ci-shared/.github/workflows/ci.yml@1.0.0
    with:
      enable-lint: true
      enable-coverage: true
      enable-title-check: true

  android-tests:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Android host tests, consumer check and AAR assembly
        run: ./gradlew testAndroidHostTest :android-consumer:verifyAndroidVariants :networking-middle:assembleAndroidMain :networking-middle-ktor:assembleAndroidMain --no-daemon
